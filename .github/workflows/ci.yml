name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The snippet checker compiles documentation code against the real
      # library, so the sibling repository has to be present.
      - name: Check out skyl
        uses: actions/checkout@v4
        with:
          repository: BAGOMBEKA-JOB-DEV/skyl
          path: .skyl
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Link and structure check
        run: npm run check:links

      - name: Compile documented Go snippets
        run: node scripts/check-snippets.mjs --skyl .skyl

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  # A single required check for branch protection, so adding a job later does
  # not mean editing the protection rules.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "A required job failed."
            exit 1
          fi
